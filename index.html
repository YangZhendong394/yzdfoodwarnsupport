<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Ditch Junk Food</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        /* 语言切换按钮 */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            font-size: 14px;
        }
        .lang-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .lang-btn:hover {
            background: #f0f0f0;
        }
        .lang-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .support-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: left;
        }
        .support-info h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: #555;
        }
        .contact-item:last-child {
            margin-bottom: 0;
        }
        .contact-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            color: #667eea;
        }
        .contact-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
        .faq-section {
            text-align: left;
            margin-top: 30px;
        }
        .faq-section h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .faq-item {
            margin-bottom: 15px;
        }
        .faq-item h4 {
            color: #444;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .faq-item p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 语言切换 -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
        </div>

        <!-- 图标（不变） -->
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>

        <!-- 标题 -->
        <h1 id="app-title">喂！放下那块炸鸡</h1>
        <p class="subtitle" id="app-subtitle">支持与帮助中心</p>

        <!-- 联系方式 -->
        <div class="support-info">
            <h3 id="contact-title">联系我们</h3>
            <div class="contact-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span id="email-label">邮箱：</span>
                <a href="mailto:598129256@qq.com">598129256@qq.com</a>
            </div>
        </div>

        <!-- FAQ -->
        <div class="faq-section">
            <h3 id="faq-title">常见问题</h3>
            <div id="faq-list">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>

        <div class="footer" id="footer-text">© 2026 放下那块炸鸡。保留所有权利。</div>
    </div>

    <script>
        // 翻译数据
        const translations = {
            zh: {
                title: "喂！放下那块炸鸡",
                subtitle: "支持与帮助中心",
                contactTitle: "联系我们",
                emailLabel: "邮箱：",
                faqTitle: "常见问题",
                faqItems: [
                    { question: "如何清除数据？", answer: "您可以设置界面清除数据，清除数据后所有运动与摄入数据将会被完全删除。" },
                    { question: "如何同步我的数据？", answer: "所有数据仅保存在您设备本地。本应用不支持云端同步或跨设备数据传输。" },
                    { question: "我的数据安全吗？", answer: "是的，您的数据经过加密并安全存储。我们绝不会与第三方分享您的个人信息。" }
                ],
                footer: "© 2026 放下那块炸鸡。保留所有权利。"
            },
            en: {
                title: "Drop That Fried Chicken",
                subtitle: "Support & Help Center",
                contactTitle: "Contact Us",
                emailLabel: "Email:",
                faqTitle: "FAQ",
                faqItems: [
                    { question: "How to clear data?", answer: "You can set the interface to clear data, and after clearing the data, all exercise and intake data will be completely deleted." },
                    { question: "How do I sync my data?", answer: "All your data is saved locally on your device only. This app does not support cloud sync or cross-device data transfer." },
                    { question: "Is my data secure?", answer: "Yes, all your data is encrypted and stored securely. We never share your personal information with third parties." }
                ],
                footer: "© 2026 Ditch Junk Food. All rights reserved."
            }
        };

        // 当前语言
        let currentLang = 'zh';

        // 渲染FAQ列表
        function renderFAQ(lang) {
            const list = document.getElementById('faq-list');
            const items = translations[lang].faqItems;
            list.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'faq-item';
                div.innerHTML = `
                    <h4>${item.question}</h4>
                    <p>${item.answer}</p>
                `;
                list.appendChild(div);
            });
        }

        // 切换语言
        function switchLang(lang) {
            if (lang === currentLang) return;
            currentLang = lang;

            // 更新按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // 更新文本
            const t = translations[lang];
            document.getElementById('app-title').textContent = t.title;
            document.getElementById('app-subtitle').textContent = t.subtitle;
            document.getElementById('contact-title').textContent = t.contactTitle;
            document.getElementById('email-label').textContent = t.emailLabel;
            document.getElementById('faq-title').textContent = t.faqTitle;
            document.getElementById('footer-text').textContent = t.footer;

            // 重新渲染FAQ
            renderFAQ(lang);

            // 更新页面lang属性
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        }

        // 默认加载中文
        document.addEventListener('DOMContentLoaded', function() {
            // 默认中文已经由HTML写好了，但需要确保FAQ渲染
            renderFAQ('zh');
            // 设置激活状态
            document.querySelector('.lang-btn[data-lang="zh"]').classList.add('active');
            document.querySelector('.lang-btn[data-lang="en"]').classList.remove('active');
        });
    </script>
</body>
</html>
